[project]
name = "pytorch-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rasyidred", email = "rasyid.red@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ezkl>=23.0.5",
    "jupyterlab>=4.6.4",
    "onnx>=1.23.0",
    "onnxscript>=0.7.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[project.scripts]
pytorch-tutorial = "pytorch_tutorial:main"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
